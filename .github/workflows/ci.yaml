name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # Checks live in scripts/precheck.sh so the same command runs here and on
      - name: Checks that need the project library
        run: scripts/precheck.sh parse tests smoke

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Lint with a stock library (lintr is not a runtime dependency).
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lintr

      # Same script as the test job, different steps: these two need only a
      # stock library.
      # NOTE both step names below are reported by the script, so a failure says
      # which check failed rather than only that "lint" did.
      - name: Checks that need only a stock library
        run: scripts/precheck.sh readme lint
