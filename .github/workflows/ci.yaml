name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The R version and every package version come from renv.lock; update
      # them with renv::update() + renv::snapshot(), not here.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # Checks live in scripts/precheck.sh so the same command runs here and on
      # a laptop. This job owns the ENVIRONMENT (R 4.5.2, renv restored); the
      # script owns what passing means. The lockfile check is part of it.
      - name: Checks that need the project library
        run: scripts/precheck.sh renv parse tests smoke

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Lint with a stock library, not the renv project library: keep the
      # project .Rprofile from activating renv (lintr is not a runtime dep).
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lintr

      # Same script as the test job, different steps: these two need only a
      # stock library, and running them here keeps lintr out of renv.lock.
      # NOTE both step names below are reported by the script, so a failure says
      # which check failed rather than only that "lint" did.
      - name: Checks that need only a stock library
        run: scripts/precheck.sh readme lint
