name: Mirror to FastOMOP

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to FastOMOP mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/fastomop/shinySAP.git"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            git push mirror HEAD:main
          else
            git push mirror "$GITHUB_REF:$GITHUB_REF"
          fi